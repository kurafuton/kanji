<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>漢字テスト</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
        }
        body {
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 500px;
            padding: 24px 18px 30px;
        }
        h1 {
            font-size: 1.3rem;
            color: #1e3b55;
            text-align: center;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .counter {
            text-align: center;
            color: #6b8a9e;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }
        .question-box {
            background: #eef4fa;
            border-radius: 22px;
            padding: 32px 16px;
            margin-bottom: 16px;
            text-align: center;
            border: 1px solid #d3e0ec;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .kana {
            font-size: 2.8rem;
            font-weight: 700;
            color: #1a3d5c;
            line-height: 1.3;
            word-break: break-word;
        }
        .answer-box {
            text-align: center;
            min-height: 70px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .placeholder {
            font-size: 2rem;
            color: #a8bfd4;
            background: #e8eef5;
            padding: 10px 36px;
            border-radius: 40px;
            border: 1px dashed #b8cbd9;
        }
        .kanji {
            font-size: 2.4rem;
            font-weight: 700;
            color: #b1452e;
            background: #fff1e0;
            padding: 10px 32px;
            border-radius: 40px;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 #ccb6a4;
            border: 1px solid #ddc7b4;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.2s, transform 0.2s;
            display: none;
        }
        .kanji.show {
            opacity: 1;
            transform: scale(1);
            display: inline-block;
        }
        .placeholder.hide {
            display: none;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            border: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 14px 22px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1 1 auto;
            min-width: 100px;
            text-align: center;
        }
        button:active {
            transform: scale(0.96);
        }
        button:disabled {
            opacity: 0.4;
            transform: none;
            pointer-events: none;
        }
        .btn-show {
            background: #2d4b6e;
            color: #fff;
            box-shadow: 0 4px 0 #1a2e42;
        }
        .btn-correct {
            background: #2d7a5e;
            color: #fff;
            box-shadow: 0 4px 0 #1d5240;
            display: none;
        }
        .btn-wrong {
            background: #b1452e;
            color: #fff;
            box-shadow: 0 4px 0 #7d2e1e;
            display: none;
        }
        .btn-correct.show, .btn-wrong.show {
            display: block;
        }
        .result {
            margin-top: 20px;
            background: #f9fbfe;
            border-radius: 20px;
            padding: 14px 16px;
            border: 1px solid #cfddee;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result h2 {
            font-size: 0.95rem;
            color: #1f3b55;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .mistake-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 14px;
            border-radius: 40px;
            margin-bottom: 6px;
            border-left: 6px solid #b1452e;
            font-size: 1rem;
        }
        .mistake-kana {
            font-weight: 600;
            color: #2c3e50;
        }
        .mistake-kanji {
            font-weight: 700;
            color: #b1452e;
            background: #ffe6dc;
            padding: 3px 14px;
            border-radius: 30px;
        }
        .empty-mistake {
            color: #6c8a9e;
            font-style: italic;
            padding: 6px 0;
        }
        .restart {
            display: block;
            margin: 18px auto 0;
            background: #e1e9f2;
            color: #1f3b55;
            box-shadow: 0 3px 0 #b6c8da;
            border: 1px solid #c2d3e4;
            font-size: 0.95rem;
            padding: 12px 28px;
            border-radius: 50px;
            width: fit-content;
            min-width: 160px;
        }
        .status {
            text-align: center;
            color: #6b8a9e;
            font-size: 0.9rem;
            margin-top: 12px;
        }
        @media (max-width: 400px) {
            .kana { font-size: 2.2rem; }
            .kanji { font-size: 2rem; padding: 8px 24px; }
            .placeholder { font-size: 1.6rem; padding: 8px 24px; }
            button { font-size: 0.9rem; padding: 12px 16px; min-width: 80px; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>漢字テスト</h1>
    <div class="counter" id="counter">0 / 0</div>

    <div class="question-box">
        <div class="kana" id="kana">ー</div>
    </div>

    <div class="answer-box">
        <div class="placeholder" id="placeholder">？</div>
        <div class="kanji" id="kanji"></div>
    </div>

    <div class="btn-row" id="btnRow">
        <button class="btn-show" id="showBtn">答えを見る</button>
        <button class="btn-correct" id="correctBtn">✓ 正解</button>
        <button class="btn-wrong" id="wrongBtn">✗ 不正解</button>
    </div>

    <div class="result" id="result">
        <h2>間違えた問題</h2>
        <div id="mistakeList"></div>
        <div class="empty-mistake" id="emptyMsg" style="display:none;">全問正解！</div>
    </div>

    <button class="restart" id="restartBtn">⟲ 最初から</button>
    <div class="status" id="status">スタート！</div>
</div>

<script>
    const DATA = [
        { kana: "オンコウ", kanji: "温厚" },
        { kana: "セイレキ", kanji: "西暦" },
        { kana: "リレキショ", kanji: "履歴書" },
        { kana: "いもほり", kanji: "芋掘り" },
        { kana: "ほり", kanji: "堀" },
        { kana: "どろ", kanji: "泥" },
        { kana: "しりごみ", kanji: "尻込み" },
        { kana: "ばいりつ", kanji: "倍率" },
        { kana: "リュウシ", kanji: "粒子" },
        { kana: "セッキン", kanji: "接近" },
        { kana: "バイヨウ", kanji: "培養" },
        { kana: "こもった", kanji: "籠った" },
        { kana: "ヒョウショウ", kanji: "表彰" },
        { kana: "かた", kanji: "肩" },
        { kana: "コショウ", kanji: "故障" },
        { kana: "コセキ", kanji: "戸籍" },
        { kana: "ゲンシロ", kanji: "原子炉" },
        { kana: "ゾウカ", kanji: "造花" },
        { kana: "カコク", kanji: "苛酷" },
        { kana: "ビョウシャ", kanji: "描写" },
        { kana: "ソウニュウ", kanji: "挿入" },
        { kana: "セイギョ", kanji: "制御" },
        { kana: "おろしうり", kanji: "卸売" },
        { kana: "トウキ", kanji: "陶器" },
        { kana: "トウスイ", kanji: "陶酔" },
        { kana: "コウセイ", kanji: "更生" },
        { kana: "ウンデイ", kanji: "雲泥" },
        { kana: "ムゾウサ", kanji: "無造作" },
        { kana: "つちかった", kanji: "培った" },
        { kana: "ゲコ", kanji: "下戸" },
        { kana: "カイキン", kanji: "解禁" }
    ];

    let queue = [];
    let current = null;
    let answered = 0;
    let mistakes = [];
    let done = false;

    const kanaEl = document.getElementById('kana');
    const placeholderEl = document.getElementById('placeholder');
    const kanjiEl = document.getElementById('kanji');
    const counterEl = document.getElementById('counter');
    const showBtn = document.getElementById('showBtn');
    const correctBtn = document.getElementById('correctBtn');
    const wrongBtn = document.getElementById('wrongBtn');
    const resultEl = document.getElementById('result');
    const mistakeListEl = document.getElementById('mistakeList');
    const emptyMsg = document.getElementById('emptyMsg');
    const restartBtn = document.getElementById('restartBtn');
    const statusEl = document.getElementById('status');

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateCounter() {
        counterEl.textContent = `${answered} / ${DATA.length}`;
    }

    function loadNext() {
        if (queue.length === 0) {
            current = null;
            kanaEl.textContent = 'ー';
            placeholderEl.style.display = 'inline-block';
            kanjiEl.style.display = 'none';
            kanjiEl.classList.remove('show');
            showBtn.disabled = true;
            correctBtn.disabled = true;
            wrongBtn.disabled = true;
            showBtn.style.display = 'none';
            correctBtn.style.display = 'none';
            wrongBtn.style.display = 'none';
            done = true;
            statusEl.textContent = '全問終了！';
            showResult();
            return;
        }

        current = queue.shift();
        placeholderEl.style.display = 'inline-block';
        kanjiEl.style.display = 'none';
        kanjiEl.classList.remove('show');
        kanjiEl.textContent = '';
        kanaEl.textContent = current.kana;

        showBtn.style.display = 'block';
        showBtn.disabled = false;
        correctBtn.style.display = 'none';
        wrongBtn.style.display = 'none';
        correctBtn.disabled = true;
        wrongBtn.disabled = true;

        updateCounter();
        statusEl.textContent = '答えを考えよう';
        done = false;
    }

    function reveal() {
        if (!current) return;
        placeholderEl.style.display = 'none';
        kanjiEl.textContent = current.kanji;
        kanjiEl.style.display = 'inline-block';
        kanjiEl.classList.add('show');

        showBtn.style.display = 'none';
        showBtn.disabled = true;
        correctBtn.style.display = 'block';
        wrongBtn.style.display = 'block';
        correctBtn.disabled = false;
        wrongBtn.disabled = false;
    }

    function record(correct) {
        if (!current) return;
        if (kanjiEl.style.display === 'none') reveal();

        if (!correct) {
            mistakes.push({ ...current });
        }

        answered++;
        updateCounter();

        showBtn.style.display = 'none';
        correctBtn.style.display = 'none';
        wrongBtn.style.display = 'none';
        correctBtn.disabled = true;
        wrongBtn.disabled = true;

        if (queue.length > 0) {
            setTimeout(loadNext, 150);
        } else {
            current = null;
            kanaEl.textContent = 'ー';
            placeholderEl.style.display = 'inline-block';
            kanjiEl.style.display = 'none';
            kanjiEl.classList.remove('show');
            done = true;
            statusEl.textContent = '全問終了！';
            showResult();
        }
    }

    function showResult() {
        resultEl.classList.add('show');
        mistakeListEl.innerHTML = '';
        if (mistakes.length === 0) {
            emptyMsg.style.display = 'block';
            mistakeListEl.style.display = 'none';
        } else {
            emptyMsg.style.display = 'none';
            mistakeListEl.style.display = 'block';
            mistakes.forEach(item => {
                const div = document.createElement('div');
                div.className = 'mistake-item';
                div.innerHTML = `<span class="mistake-kana">${item.kana}</span><span class="mistake-kanji">${item.kanji}</span>`;
                mistakeListEl.appendChild(div);
            });
        }
    }

    function reset() {
        queue = DATA.map(q => ({ ...q }));
        shuffle(queue);
        current = null;
        answered = 0;
        mistakes = [];
        done = false;
        resultEl.classList.remove('show');
        emptyMsg.style.display = 'none';
        mistakeListEl.innerHTML = '';
        statusEl.textContent = 'スタート！';
        loadNext();
        updateCounter();
    }

    showBtn.addEventListener('click', reveal);
    correctBtn.addEventListener('click', () => record(true));
    wrongBtn.addEventListener('click', () => record(false));
    restartBtn.addEventListener('click', reset);

    reset();
</script>
</body>
</html>
