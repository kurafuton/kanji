<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>漢字テスト</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,'Hiragino Sans','Yu Gothic',sans-serif}
body{background:#f0f4f8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px;transition:background .3s,color .3s}
.card{background:#fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.12);width:100%;max-width:500px;padding:24px 18px 30px;transition:background .3s,box-shadow .3s}
h1{font-size:1.3rem;color:#1e3b55;text-align:center;margin-bottom:6px;font-weight:600;transition:color .3s}
.rd{text-align:center;font-size:.9rem;color:#b1452e;font-weight:600;margin-bottom:4px;min-height:1.3rem;transition:color .3s}
.ct{text-align:center;color:#6b8a9e;font-size:.95rem;margin-bottom:18px;transition:color .3s}
.qb{background:#eef4fa;border-radius:22px;padding:32px 16px;margin-bottom:16px;text-align:center;border:1px solid #d3e0ec;min-height:120px;display:flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s}
.kn{font-size:2.8rem;font-weight:700;color:#1a3d5c;line-height:1.3;word-break:break-word;transition:color .3s}
.ab{text-align:center;min-height:70px;margin-bottom:18px;display:flex;align-items:center;justify-content:center}
.ph{font-size:2rem;color:#a8bfd4;background:#e8eef5;padding:10px 36px;border-radius:40px;border:1px dashed #b8cbd9;transition:background .3s,color .3s,border-color .3s}
.kj{font-size:2.4rem;font-weight:700;color:#b1452e;background:#fff1e0;padding:10px 32px;border-radius:40px;letter-spacing:2px;box-shadow:0 4px 0 #ccb6a4;border:1px solid #ddc7b4;opacity:0;transform:scale(.9);transition:opacity .2s,transform .2s,background .3s,color .3s,border-color .3s,box-shadow .3s;display:none}
.kj.s{opacity:1;transform:scale(1);display:inline-block}
.br{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:none;font-size:1rem;font-weight:600;padding:14px 22px;border-radius:50px;cursor:pointer;transition:all .15s;flex:1 1 auto;min-width:100px;text-align:center}
button:active{transform:scale(.96)}
button:disabled{opacity:.4;transform:none;pointer-events:none}
.bs{background:#2d4b6e;color:#fff;box-shadow:0 4px 0 #1a2e42;transition:background .3s,box-shadow .3s}
.bc{background:#2d7a5e;color:#fff;box-shadow:0 4px 0 #1d5240;display:none;transition:background .3s,box-shadow .3s}
.bw{background:#b1452e;color:#fff;box-shadow:0 4px 0 #7d2e1e;display:none;transition:background .3s,box-shadow .3s}
.rs{margin-top:20px;background:#f9fbfe;border-radius:20px;padding:14px 16px;border:1px solid #cfddee;max-height:200px;overflow-y:auto;display:none;transition:background .3s,border-color .3s}
.rs.s{display:block}
.rs h2{font-size:.95rem;color:#1f3b55;margin-bottom:10px;font-weight:700;transition:color .3s}
.mi{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 14px;border-radius:40px;margin-bottom:6px;border-left:6px solid #b1452e;font-size:1rem;transition:background .3s}
.mk{font-weight:600;color:#2c3e50;transition:color .3s}
.mj{font-weight:700;color:#b1452e;background:#ffe6dc;padding:3px 14px;border-radius:30px;transition:background .3s,color .3s}
.em{color:#6c8a9e;font-style:italic;padding:6px 0;transition:color .3s}
.rb{display:block;margin:18px auto 0;background:#e1e9f2;color:#1f3b55;box-shadow:0 3px 0 #b6c8da;border:1px solid #c2d3e4;font-size:.95rem;padding:12px 28px;border-radius:50px;width:fit-content;min-width:160px;transition:background .3s,color .3s,box-shadow .3s,border-color .3s}
@media(max-width:400px){.kn{font-size:2.2rem}.kj{font-size:2rem;padding:8px 24px}.ph{font-size:1.6rem;padding:8px 24px}button{font-size:.9rem;padding:12px 16px;min-width:80px}}
body.dark{background:#121820}
body.dark .card{background:#1e2833;box-shadow:0 12px 30px rgba(0,0,0,.5)}
body.dark h1{color:#d0e0f0}
body.dark .rd{color:#e88a72}
body.dark .ct{color:#8aa4b8}
body.dark .qb{background:#26313d;border-color:#344454}
body.dark .kn{color:#d0e0f0}
body.dark .ph{background:#2a3644;color:#6a8096;border-color:#3e5062}
body.dark .kj{background:#3d2a22;color:#e88a72;border-color:#5a4038;box-shadow:0 4px 0 #2a1e18}
body.dark .bs{background:#3a5a7a;box-shadow:0 4px 0 #1e3045}
body.dark .bc{background:#3a8a6a;box-shadow:0 4px 0 #1d4a38}
body.dark .bw{background:#c45842;box-shadow:0 4px 0 #7d2e1e}
body.dark .rs{background:#1e2a36;border-color:#344454}
body.dark .rs h2{color:#d0e0f0}
body.dark .mi{background:#26313d;border-left-color:#c45842}
body.dark .mk{color:#b8cce0}
body.dark .mj{background:#4a2c22;color:#e88a72}
body.dark .em{color:#6a8096}
body.dark .rb{background:#2a3644;color:#b8cce0;box-shadow:0 3px 0 #1a2430;border-color:#3e5062}
</style>
</head>
<body>
<div class="card">
<h1>漢字テスト</h1>
<div class="rd" id="rd"></div>
<div class="ct" id="ct">0 / 0</div>
<div class="qb"><div class="kn" id="kn">ー</div></div>
<div class="ab"><div class="ph" id="ph">？</div><div class="kj" id="kj"></div></div>
<div class="br" id="br">
<button class="bs" id="sb">答えを見る</button>
<button class="bc" id="cb">✓ 正解</button>
<button class="bw" id="wb">✗ 不正解</button>
</div>
<div class="rs" id="rs">
<h2>間違えた問題</h2>
<div id="ml"></div>
<div class="em" id="em" style="display:none">全問正解！</div>
</div>
<button class="rb" id="rb">⟲ 最初から</button>
</div>
<script>
const D=[{k:"サッシ",j:"冊子"},{k:"ヘンシュウ",j:"編集"},{k:"カンビ",j:"完備"},{k:"ケイリン",j:"競輪"},{k:"リンリ",j:"倫理"},{k:"ヒョウロン",j:"評論"},{k:"カイキョウ",j:"海峡"},{k:"シンコキュウ",j:"深呼吸"},{k:"はさむ",j:"挟む"},{k:"シンシツ",j:"寝室"},{k:"せまい",j:"狭い"},{k:"シンリャク",j:"侵略"},{k:"シンスイ",j:"浸水"},{k:"バイショウ",j:"賠償"},{k:"バイシン",j:"陪審"},{k:"カイボウ",j:"解剖"},{k:"コウバイ",j:"購買"},{k:"コウゾウ",j:"構造"},{k:"マンゾク",j:"満足"},{k:"キョウユ",j:"教諭"},{k:"チユ",j:"治癒"},{k:"ヒユ",j:"比喩"},{k:"ユシュツ",j:"輸出"},{k:"ユカイ",j:"愉快"},{k:"こと",j:"異"},{k:"ヨクチョク",j:"翌朝"},{k:"ビヨク",j:"尾翼"},{k:"テンコ",j:"点呼"},{k:"シンガイ",j:"侵害"},{k:"ヘンキョウ",j:"偏狭"},{k:"マンキツ",j:"満喫"},{k:"ヘンセイ",j:"編成"},{k:"リンカ",j:"輪禍"},{k:"コウナイ",j:"構内"}];
let q=[],c=null,a=0,t=0,m=[],r=1,rv=0;
const $=id=>document.getElementById(id);
const kn=$('kn'),ph=$('ph'),kj=$('kj'),ct=$('ct'),rd=$('rd'),sb=$('sb'),cb=$('cb'),wb=$('wb'),rs=$('rs'),ml=$('ml'),em=$('em'),rb=$('rb');
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function uc(){ct.textContent=`${a} / ${t}`}
function ur(){rd.textContent=rv?`復習モード（${r}週目）`:'1週目'}
function sr(p,v){q=sh(p.map(x=>({...x})));t=q.length;a=0;m=[];rv=v;ur();uc();ln()}
function ln(){
if(!q.length){c=null;kn.textContent='ー';ph.style.display='inline-block';kj.style.display='none';kj.classList.remove('s');sb.style.display='none';cb.style.display='none';wb.style.display='none';sb.disabled=cb.disabled=wb.disabled=true;shw();return}
c=q.shift();ph.style.display='inline-block';kj.style.display='none';kj.classList.remove('s');kj.textContent='';kn.textContent=c.k;
sb.style.display='block';sb.disabled=false;cb.style.display='none';wb.style.display='none';cb.disabled=wb.disabled=true;uc()}
function rv2(){if(!c)return;ph.style.display='none';kj.textContent=c.j;kj.style.display='inline-block';kj.classList.add('s');
sb.style.display='none';sb.disabled=true;cb.style.display='block';wb.style.display='block';cb.disabled=wb.disabled=false}
function rc(ok){if(!c)return;if(kj.style.display==='none')rv2();if(!ok)m.push({...c});a++;uc();
sb.style.display='none';cb.style.display='none';wb.style.display='none';cb.disabled=wb.disabled=true;
if(q.length)setTimeout(ln,150);else{c=null;kn.textContent='ー';ph.style.display='inline-block';kj.style.display='none';kj.classList.remove('s');shw()}}
function shw(){rs.classList.add('s');ml.innerHTML='';
if(!m.length){em.style.display='block';ml.style.display='none';if(rv)rd.textContent='完全クリア！'}
else{em.style.display='none';ml.style.display='block';m.forEach(x=>{const d=document.createElement('div');d.className='mi';d.innerHTML=`<span class="mk">${x.k}</span><span class="mj">${x.j}</span>`;ml.appendChild(d)});
r++;setTimeout(()=>{sr(m,1)},1200)}}
function rst(){r=1;rv=0;rs.classList.remove('s');em.style.display='none';ml.innerHTML='';sr(D,0)}
sb.onclick=rv2;cb.onclick=()=>rc(1);wb.onclick=()=>rc(0);rb.onclick=rst;

document.addEventListener('keydown',e=>{
if(e.key===' '||e.key==='Enter'){
e.preventDefault();
if(sb.style.display!=='none'&&!sb.disabled)rv2();
else if(cb.style.display!=='none'&&!cb.disabled)rc(1);
else if(wb.style.display!=='none'&&!wb.disabled)rc(0);
}
if(e.key==='ArrowRight'&&cb.style.display!=='none'&&!cb.disabled){e.preventDefault();rc(1)}
if(e.key==='ArrowLeft'&&wb.style.display!=='none'&&!wb.disabled){e.preventDefault();rc(0)}
});

if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('dark')}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{document.body.classList.toggle('dark',e.matches)});

rst();
</script>
</body>
</html>
